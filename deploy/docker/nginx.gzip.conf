# T-Ride frontend — enable gzip for text assets and fonts (http context via conf.d)
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 256;
gzip_types
    text/plain
    text/css
    text/xml
    application/json
    application/javascript
    application/xml
    application/xml+rss
    application/wasm
    font/ttf
    font/otf
    font/woff
    font/woff2;
