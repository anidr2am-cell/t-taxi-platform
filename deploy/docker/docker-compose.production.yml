# T-Ride production — isolated Docker stack (coexists with staging on same host)
#
# Usage (from deploy/docker/):
#   cp .env.production.example .env.production   # edit secrets on server only
#   docker compose -f docker-compose.production.yml --env-file .env.production up -d --build
#
# Smoke ports (host → container):
#   127.0.0.1:4100 → tride-prod-backend:3000 (loopback only — nginx/Caddy use tride-prod-backend:3000)
#   4101 → tride-prod-frontend:80
#
# Does NOT use host 80/443, ktaxi-nginx, or staging containers/volumes.
# tride-prod-db: mariadb:10.11 (internal network only; no host DB port)

name: tride-production

x-logging: &default-logging
  driver: json-file
  options:
    max-size: ${DOCKER_LOG_MAX_SIZE:-10m}
    max-file: ${DOCKER_LOG_MAX_FILE:-5}

services:
  tride-prod-db:
    image: mariadb:10.11
    container_name: tride-prod-db
    restart: unless-stopped
    logging: *default-logging
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env.production}
      MYSQL_DATABASE: ${DB_NAME:-tride_production}
      MYSQL_USER: ${DB_USER:-tride_app_prod}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.production}
      TZ: ${TZ:-Asia/Bangkok}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+07:00
    volumes:
      - tride_prod_db_data:/var/lib/mysql
    networks:
      - tride-prod-net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  tride-prod-backend:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.backend
      target: production
    container_name: tride-prod-backend
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    depends_on:
      tride-prod-db:
        condition: service_healthy
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: tride-prod-db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-tride_production}
      DB_USER: ${DB_USER:-tride_app_prod}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.production}
      CORS_ORIGIN: ${CORS_ORIGIN:?Set CORS_ORIGIN in .env.production}
      PUBLIC_API_URL: ${PUBLIC_API_URL:?Set PUBLIC_API_URL in .env.production}
      UPLOAD_DIR: /srv/tride/uploads
      LOG_DIR: /srv/tride/logs
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in .env.production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET in .env.production}
      URGENT_NEGOTIATION_TIMEOUT_ENABLED: ${URGENT_NEGOTIATION_TIMEOUT_ENABLED:-true}
      URGENT_NEGOTIATION_TIMEOUT_INTERVAL_MS: ${URGENT_NEGOTIATION_TIMEOUT_INTERVAL_MS:-30000}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      ALLOW_DEV_QR_REISSUE: ${ALLOW_DEV_QR_REISSUE:-false}
      FLIGHT_SYNC_ENABLED: ${FLIGHT_SYNC_ENABLED:-false}
      TZ: ${TZ:-Asia/Bangkok}
    ports:
      - "127.0.0.1:${TRIDE_BACKEND_HOST_PORT:-4100}:3000"
    volumes:
      - tride_prod_uploads:/srv/tride/uploads
      - tride_prod_logs:/srv/tride/logs
    networks:
      - tride-prod-net

  tride-prod-frontend:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.frontend
      args:
        APP_ENV: production
        API_BASE_URL: ${TRIDE_API_BASE_URL:-https://ride.example.com}
        SOCKET_URL: ${TRIDE_SOCKET_URL:-https://ride.example.com}
    container_name: tride-prod-frontend
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      tride-prod-backend:
        condition: service_healthy
    ports:
      - "${TRIDE_FRONTEND_HOST_PORT:-4101}:80"
    volumes:
      - ./nginx.frontend.production.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - tride-prod-net

networks:
  tride-prod-net:
    name: tride-prod-net
    driver: bridge

volumes:
  tride_prod_db_data:
    name: tride_prod_db_data
  tride_prod_uploads:
    name: tride_prod_uploads
  tride_prod_logs:
    name: tride_prod_logs
