name: PR Checks

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  blog:
    name: Static blog build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and test static blog
        run: npm run blog:build && npm run blog:test

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      guest-lookup-db:
        image: mariadb:10.11
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "yes"
          MARIADB_DATABASE: qa_guest_lookup_ci
        ports:
          - 33317:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      JWT_ACCESS_SECRET: test-access-secret-value
      JWT_REFRESH_SECRET: test-refresh-secret-value
      DB_USER: test
      DB_NAME: ttaxi_test
      GUEST_LOOKUP_TEST_DB: qa_guest_lookup_ci
      GUEST_LOOKUP_TEST_DB_HOST: 127.0.0.1
      GUEST_LOOKUP_TEST_DB_PORT: "33317"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test
        # Guest lookup also runs the real SELECT/join and token transaction on
        # an isolated MariaDB fixture; other tests retain their mocked pools.

  frontend-test:
    name: Frontend Flutter tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # Matches local tooling (Flutter 3.41.6 / Dart 3.11.4) and pubspec sdk ^3.11.4
          flutter-version: "3.41.6"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run Flutter tests
        run: flutter test

  driver-app-test:
    name: Driver app Flutter tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: driver_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.6"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test

  frontend-web-build:
    name: Frontend web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.6"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build web (verification only)
        run: flutter build web --release --no-wasm-dry-run
