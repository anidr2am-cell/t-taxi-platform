# T-Ride production frontend container nginx — SPA + same-origin /api/ proxy
# Upstream targets tride-landing-ko-backend on tride-prod-net (not staging tride-backend).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Preview-Backend tride-landing-ko-backend always;
    location = / { add_header X-Preview-Backend tride-landing-ko-backend always; add_header Cache-Control no-store always; try_files /landing/index.html =404; }
    location ^~ /landing-assets/ { add_header X-Preview-Backend tride-landing-ko-backend always; add_header Cache-Control no-cache always; try_files $uri =404; }
    client_max_body_size 50m;

    error_page 413 = /upload-too-large.json;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/ {
        add_header X-Preview-Backend tride-landing-ko-backend always;
        proxy_pass http://tride-landing-ko-backend:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Guest-Access-Token $http_x_guest_access_token;
        proxy_read_timeout 60s;
    }

    location /socket.io/ {
        proxy_pass http://tride-landing-ko-backend:3000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 75s;
    }

    location = /upload-too-large.json {
        internal;
        default_type application/json;
        add_header X-Preview-Backend tride-landing-ko-backend always; add_header Cache-Control "no-store";
        return 413 '{"success":false,"error_code":"FILE_TOO_LARGE","code":"FILE_TOO_LARGE","message":"Uploaded files are too large"}';
    }

    location = /robots.txt {
        default_type text/plain;
        add_header X-Preview-Backend tride-landing-ko-backend always; add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location = /sitemap.xml {
        types { }
        default_type application/xml;
        charset utf-8;
        add_header X-Preview-Backend tride-landing-ko-backend always; add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location = /sitemap-app.xml {
        types { }
        default_type application/xml;
        charset utf-8;
        add_header X-Preview-Backend tride-landing-ko-backend always; add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location = /sitemap-blog.xml {
        types { }
        default_type application/xml;
        charset utf-8;
        add_header X-Preview-Backend tride-landing-ko-backend always; add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location = /blog {
        absolute_redirect off;
        return 308 /blog/;
    }

    location ~* ^/blog/assets/.*\.(?:css|png|jpg|jpeg|gif|webp|svg|ico|woff2?)$ {
        add_header X-Preview-Backend tride-landing-ko-backend always; add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    location /blog/ {
        add_header X-Preview-Backend tride-landing-ko-backend always; add_header Cache-Control "no-cache";
        try_files $uri/index.html $uri =404;
    }

    location = /google576bcd099d0a6278.html {
        default_type text/html;
        add_header X-Preview-Backend tride-landing-ko-backend always; add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location = /naverf8f2e498f13287988d4e139149cf74aa.html {
        default_type text/html;
        add_header X-Preview-Backend tride-landing-ko-backend always; add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location = /downloads/driver-app.apk {
        return 302 https://trider.taxi$request_uri;
        types { application/vnd.android.package-archive apk; }
        add_header X-Preview-Backend tride-landing-ko-backend always; add_header Cache-Control "no-store" always;
        add_header Content-Disposition 'attachment; filename="TRider-Driver.apk"' always;
        try_files $uri =404;
    }

    location = /downloads/release.json {
        return 302 https://trider.taxi$request_uri;
        default_type application/json;
        charset utf-8;
        add_header X-Preview-Backend tride-landing-ko-backend always; add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location /downloads/ {
        return 302 https://trider.taxi$request_uri;
        add_header X-Preview-Backend tride-landing-ko-backend always; add_header Cache-Control "no-store" always;
        try_files $uri $uri/index.html =404;
    }

    location = /index.html {
        add_header X-Preview-Backend tride-landing-ko-backend always; add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location ~* ^/(?:main\.dart\.js|flutter\.js|flutter_bootstrap\.js|flutter_service_worker\.js|firebase-messaging-sw\.js|version\.json|manifest(?:-driver)?\.json)$ {
        add_header X-Preview-Backend tride-landing-ko-backend always; add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|webp|svg|ico|wasm|ttf|otf|woff2?)$ {
        add_header X-Preview-Backend tride-landing-ko-backend always; add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
